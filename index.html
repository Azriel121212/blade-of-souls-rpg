class Enemy {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.width = 24; this.height = 24;
        this.hasShield = false;
        this.isElite = false;
        this.chargeState = 'walk';
        this.chargeTimer = 0;
        this.dashDir = { x: 0, y: 0 };
        this.bossStompTimer = 360;
        this.hasSummonedMinions = false;
        
        if (type === 'slime') {
            this.hp = 25 + (player.level * 6); this.maxHp = this.hp;
            this.speed = 1.0; this.color = '#32cd32';
            this.xp = 12; this.damage = 6; this.emoji = "🟢";
        } else if (type === 'skeleton') {
            this.hp = 40 + (player.level * 9); this.maxHp = this.hp;
            this.speed = 1.2; this.color = '#dddddd';
            this.xp = 20; this.damage = 12; this.emoji = "💀";
        } else if (type === 'bat') {
            this.hp = 20 + (player.level * 4); this.maxHp = this.hp;
            this.speed = 2.0; this.color = '#8a2be2';
            this.xp = 15; this.damage = 9; this.emoji = "🦇";
        } else if (type === 'mage') {
            this.hp = 30 + (player.level * 6); this.maxHp = this.hp;
            this.speed = 0.8; this.color = '#ff4400';
            this.xp = 25; this.damage = 15; this.emoji = "🧙";
        } else if (type === 'shield') {
            this.hp = 55 + (player.level * 10); this.maxHp = this.hp;
            this.speed = 1.0; this.color = '#708090';
            this.xp = 35; this.damage = 14; this.emoji = "🛡️";
            this.hasShield = true;
        } else if (type === 'charger') {
            this.hp = 35 + (player.level * 7); this.maxHp = this.hp;
            this.speed = 1.3; this.color = '#ff1493';
            this.xp = 30; this.damage = 16; this.emoji = "🐗";
        }

        // Elite roll jika level >= 6 dan bukan boss
        if (player.level >= 6 && !this.isBoss && Math.random() < 0.25) {
            this.isElite = true;
            this.hp = Math.floor(this.hp * 2.5); this.maxHp = this.hp;
            this.speed *= 1.2;
            this.damage = Math.floor(this.damage * 1.3);
            this.xp *= 3;
            this.width = Math.floor(this.width * 1.3);
            this.height = Math.floor(this.height * 1.3);
        }

        this.cooldown = 0;
        this.bossState = 'walk'; // state buat boss (walk, attack, die)
        this.stateTimer = 0;
        this.poise = 100;
        this.maxPoise = 100;
        this.isStaggered = false;
        this.staggerTimer = 0;
        this.isEnraged = false;
    }

    takePoiseDamage(amount) {
        if (!this.isBoss || this.isStaggered || this.bossState === 'die') return;
        this.poise = Math.max(0, this.poise - amount);
        if (this.poise <= 0) {
            this.isStaggered = true;
            this.staggerTimer = 160; // ~2.7 detik vulnerability window
            this.bossState = 'walk';
            playSound('shatter');
            triggerScreenShake(10);
            floatingTexts.push(new FloatingText(this.x, this.y - 65, "GUARD BROKEN! STAGGERED!", "#ffcc00", 24));
            for (let p = 0; p < 25; p++) particles.push(new Particle(this.x, this.y, '#ffd700'));
        }
    }

    update() {
        if (this.isBoss && this.bossState === 'die') {
            this.stateTimer++;
            if (this.stateTimer > 120) { // 120 frame death animation (2 detik)
                this.finishDie();
            }
            return; // stop moving
        }

        // State Boss Tertegun (Staggered / Guard Broken)
        if (this.isBoss && this.isStaggered) {
            this.staggerTimer--;
            if (Math.random() < 0.25) {
                particles.push(new Particle(this.x + (Math.random() - 0.5) * 35, this.y - 40, '#ffd700'));
            }
            if (this.staggerTimer <= 0) {
                this.isStaggered = false;
                this.poise = this.maxPoise;
                floatingTexts.push(new FloatingText(this.x, this.y - 50, "RECOVERED!", "#ffffff", 16));
            }
            return; // Diam dan tidak bisa menyerang saat Staggered!
        }

        // Regenerasi Poise pasif jika tidak diserang
        if (this.isBoss && !this.isStaggered && this.poise < this.maxPoise && Math.random() < 0.05) {
            this.poise = Math.min(this.maxPoise, this.poise + 1);
        }

        // Cek Boss Mengamuk (Enrage Phase saat HP < 30%)
        if (this.isBoss && !this.isEnraged && this.hp <= this.maxHp * 0.3 && this.bossState !== 'die') {
            this.isEnraged = true;
            this.speed *= 1.35;
            playSound('shatter');
            triggerScreenShake(12);
            floatingTexts.push(new FloatingText(this.x, this.y - 75, "🔥 BOSS ENRAGED!!", "#ff0000", 28));
            for (let p = 0; p < 25; p++) particles.push(new Particle(this.x, this.y, '#ff0000'));
        }
        if (this.isBoss && this.isEnraged && Math.random() < 0.35) {
            particles.push(new Particle(this.x + (Math.random() - 0.5) * 50, this.y + (Math.random() - 0.5) * 50, '#ff3300'));
        }
        
        if (this.isBoss && this.bossState === 'attack') {
            this.stateTimer++;
            if (this.stateTimer > 35) { // 7 frame attack animation
                this.bossState = 'walk';
            }
            return; // stop moving while attacking
        }

        // Boss Spesial Skill: Earthquake Stomp & Minion Summon
        if (this.isBoss) {
            this.bossStompTimer--;
            if (this.bossStompTimer === 45) {
                floatingTexts.push(new FloatingText(this.x, this.y - 70, "EARTHQUAKE!", "#ff3333", 22));
                for (let k = 0; k < 12; k++) particles.push(new Particle(this.x, this.y, '#ff3333'));
            }
            if (this.bossStompTimer <= 0) {
                bossShockwaves.push(new BossShockwave(this.x, this.y));
                playSound('hit');
                triggerScreenShake(10);
                this.bossStompTimer = this.isEnraged ? 210 : 420; // 2x lebih cepat saat Enraged!
            }

            // Minion summon di 50% HP
            if (!this.hasSummonedMinions && this.hp <= this.maxHp * 0.5) {
                this.hasSummonedMinions = true;
                floatingTexts.push(new FloatingText(this.x, this.y - 80, "MINIONS, TO ARMS!", "#ff0000", 28));
                playSound('magic');
                for (let m = 0; m < 4; m++) {
                    let offX = Math.cos(m * Math.PI / 2) * 80;
                    let offY = Math.sin(m * Math.PI / 2) * 80;
                    enemies.push(new Enemy(this.x + offX, this.y + offY, 'skeleton'));
                }
            }
        }

        // Jalan ke arah player
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        // Perilaku Mage
        if (this.type === 'mage') {
            if (dist > 200) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            } else if (dist < 150) {
                this.x -= (dx / dist) * this.speed * 0.5; // mundur pelan pelan
                this.y -= (dy / dist) * this.speed * 0.5;
            }
            
            if (this.cooldown > 0) this.cooldown--;
            if (this.cooldown === 0) {
                const px = (dx / dist) * 2;
                const py = (dy / dist) * 2;
                enemyProjectiles.push(new EnemyProjectile(this.x, this.y, px, py, this.damage));
                this.cooldown = 240; // tembak per 4 detik
            }
            return;
        }

        // Perilaku Charger / Dasher
        if (this.type === 'charger') {
            if (this.chargeState === 'walk') {
                if (dist > 5) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                if (dist < 220 && dist > 60 && Math.random() < 0.02) {
                    this.chargeState = 'windup';
                    this.chargeTimer = 25;
                    this.dashDir = { x: dx / dist, y: dy / dist };
                    floatingTexts.push(new FloatingText(this.x, this.y - 20, "!", "#ff1493", 22));
                }
            } else if (this.chargeState === 'windup') {
                this.x += (Math.random() - 0.5) * 4;
                this.chargeTimer--;
                if (this.chargeTimer <= 0) {
                    this.chargeState = 'dash';
                    this.chargeTimer = 22;
                    playSound('wave');
                }
                return;
            } else if (this.chargeState === 'dash') {
                this.x += this.dashDir.x * 7.5;
                this.y += this.dashDir.y * 7.5;
                if (Math.random() < 0.5) particles.push(new Particle(this.x, this.y, '#ff1493'));
                
                if (dist < (this.width/2 + player.width/2 + 15)) {
                    player.takeDamage(Math.floor(this.damage * 1.4));
                    this.chargeState = 'walk';
                }

                this.chargeTimer--;
                if (this.chargeTimer <= 0) {
                    this.chargeState = 'walk';
                }
                return;
            }
        } else {
            if (dist > 5) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
        }
        
        // Tambahan gerak gelombang untuk kelelawar
        if (this.type === 'bat') {
            this.sinOffset = (this.sinOffset || 0) + 0.15;
            this.y += Math.sin(this.sinOffset) * 2;
        }

        // Serang Player
        if (this.cooldown > 0) this.cooldown--;
        if (dist < (this.width/2 + player.width/2 + 20) && this.cooldown === 0) {
            if (this.isBoss) {
                this.bossState = 'attack';
                this.stateTimer = 0;
            }
            player.takeDamage(this.damage);
            this.cooldown = 90; // cooldown 1.5 detik
            // Player kepukul mundur
            player.x += (dx / dist) * 15;
            player.y += (dy / dist) * 15;
        }
    }

    takeDamage(amount) {
        if (this.isBoss && this.bossState === 'die') return; // kebal pas mati
        
        // 2x Critical Damage saat Boss Staggered!
        if (this.isBoss && this.isStaggered) {
            amount = Math.floor(amount * 2.0);
            floatingTexts.push(new FloatingText(this.x, this.y - 35, "CRITICAL 2x!", "#ffd700", 18));
            triggerScreenShake(5);
        }

        this.hp -= amount;
        floatingTexts.push(new FloatingText(this.x, this.y - 15, amount, this.isElite ? "#ffaa00" : (this.isBoss ? "#ff3333" : "#ffffff")));
        for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, this.color));
        if (this.hp <= 0) {
            if (this.isBoss) {
                this.bossState = 'die';
                this.stateTimer = 0;
            } else {
                this.finishDie();
            }
        }
    }

    finishDie() {
        player.gainXp(this.xp);
        for(let i=0; i<15; i++) particles.push(new Particle(this.x, this.y, this.color));
        
        // Efek Vampire / Lifesteal saat membunuh musuh
        if (player.lifesteal > 0) {
            player.hp = Math.min(player.maxHp, player.hp + player.lifesteal);
            floatingTexts.push(new FloatingText(player.x, player.y - 25, `+${player.lifesteal} HP`, "#22c55e", 12));
            updateUI();
        }

        if (this.isBoss) {
            // Boss drop 25 koin tersebar + 2 Heart + 1 Sword!
            for (let k = 0; k < 5; k++) {
                let offX = (Math.random() - 0.5) * 60;
                let offY = (Math.random() - 0.5) * 60;
                loot.push(new CoinLoot(this.x + offX, this.y + offY, 5));
            }
            loot.push(new ItemLoot(this.x - 20, this.y, 'heart'));
            loot.push(new ItemLoot(this.x + 20, this.y, 'heart'));
            loot.push(new ItemLoot(this.x, this.y + 20, 'sword'));
            floatingTexts.push(new FloatingText(canvas.width / 2, canvas.height / 2, "BOSS DEFEATED! +25 COINS", "#ffd700", 28));
        } else if (this.isElite) {
            // Elite drops 5 coins + high heart drop
            loot.push(new CoinLoot(this.x, this.y, 5));
            if (Math.random() < 0.5) loot.push(new ItemLoot(this.x, this.y, 'heart'));
            floatingTexts.push(new FloatingText(this.x, this.y - 30, "★ ELITE DEFEATED! +5 COINS", "#ffd700", 16));
        } else {
            // Normal monster drops
            let coinVal = this.type === 'mage' || this.type === 'shield' ? 2 : 1;
            loot.push(new CoinLoot(this.x, this.y, coinVal));
            
            let rand = Math.random();
            if (rand < 0.15) {
                loot.push(new ItemLoot(this.x + 10, this.y, 'heart'));
            } else if (rand < 0.25) {
                loot.push(new ItemLoot(this.x - 10, this.y, 'sword'));
            }
        }
        
        const index = enemies.indexOf(this);
        if (index > -1) enemies.splice(index, 1);
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Aura Emas jika Elite
        if (this.isElite) {
            ctx.fillStyle = 'rgba(255, 170, 0, 0.25)';
            ctx.beginPath(); ctx.ellipse(0, this.height/2 + 5, this.width/2 + 10, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2.5; ctx.stroke();
        }

        // Aura Api jika Boss Enraged
        if (this.isBoss && this.isEnraged) {
            ctx.fillStyle = 'rgba(255, 30, 0, 0.25)';
            ctx.beginPath(); ctx.ellipse(0, this.height/2 + 10, this.width/2 + 25, 14, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ff2200'; ctx.lineWidth = 3; ctx.stroke();
        }

        // Balik muka (hadap kiri) kalau player di kirinya
        if (player.x < this.x) ctx.scale(-1, 1);
        
        if (this.isBoss) {
            ctx.scale(2.5, 2.5); // Boss ukurannya raksasa!
        }

        // Bayangan
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(0, this.height/2 + 5, this.width/2, 4, 0, 0, Math.PI * 2); ctx.fill();

        const frameIdx = Math.floor(Date.now() / 200) % 4;
        let drawn = false;

        // Ambil gambar monster pakai crop proporsional
        if (this.isBoss) {
            let f, sy, col;
            if (this.bossState === 'walk') {
                col = Math.floor(Date.now() / 150) % 6;
                f = BOSS_FRAMES.walk[col];
                sy = 384 + 40; 
            } else if (this.bossState === 'attack') {
                col = Math.floor(this.stateTimer / 5) % 7; 
                f = BOSS_FRAMES.attack[col];
                sy = 768 + 40;
            } else if (this.bossState === 'die') {
                col = Math.floor(this.stateTimer / 8); // Play full 8 frames smoothly
                if (col >= 8) col = 7; // diam di abu pas udah kelar
                f = BOSS_FRAMES.die[col];
                sy = 1152 + 40;
            }

            let scale = 90 / 344; // keep height scale constant
            let dw = f.w * scale;
            let dh = 344 * scale; 
            
            // Jangkar boss persis di tengah bounding box-nya sendiri
            let dx = -(dw / 2); 
            let dy = -55;

            if (imgBoss.complete && imgBoss.naturalWidth > 0) {
                // Gambar pakai exact crop
                ctx.drawImage(imgBoss, f.x, sy, f.w, 344, dx, dy, dw, dh);
                drawn = true;
            }
        } else if (this.type === 'slime') {
            drawn = drawSpriteProportional(ctx, imgEntities, 0 + (frameIdx * 0.0875), 0.02, 0.0875, 0.28, -25, -35, 50, 50);
        } else if (this.type === 'skeleton' || this.type === 'shield') {
            drawn = drawSpriteProportional(ctx, imgEntities, 0.35 + (frameIdx * 0.0875), 0.02, 0.0875, 0.30, -25, -50, 50, 65);
            // Gambar tameng di depan jika punya tameng
            if (this.hasShield) {
                ctx.fillStyle = '#708090';
                ctx.fillRect(8, -35, 8, 30);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.strokeRect(8, -35, 8, 30);
            }
        } else if (this.type === 'bat' || this.type === 'charger') {
            drawn = drawSpriteProportional(ctx, imgEntities, 0.72, 0.12, 0.12, 0.16, -25, -35, 50, 50);
        }
        
        if (!drawn) {
            ctx.font = "24px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(this.emoji, 0, 0);
        }
        
        // Efek visual Stun / Bintang saat Boss Staggered
        if (this.isBoss && this.isStaggered) {
            let stunAngle = Date.now() / 150;
            ctx.font = "14px Arial"; ctx.textAlign = "center";
            ctx.fillText("💫", Math.cos(stunAngle) * 14, -58);
            ctx.fillText("💫", Math.cos(stunAngle + Math.PI) * 14, -58);
        }

        ctx.restore();

        // Health & Status Bar
        if (this.isBoss) {
            // Boss HP Bar
            const hpPercent = Math.max(0, this.hp / this.maxHp);
            ctx.fillStyle = '#111111'; ctx.fillRect(this.x - 35, this.y - 48, 70, 7);
            ctx.fillStyle = this.isEnraged ? '#ff2200' : '#ff4444';
            ctx.fillRect(this.x - 35, this.y - 48, 70 * hpPercent, 7);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(this.x - 35, this.y - 48, 70, 7);

            // Boss Poise / Posture Bar (Kuning/Oranye)
            const poisePercent = Math.max(0, this.poise / this.maxPoise);
            ctx.fillStyle = '#111111'; ctx.fillRect(this.x - 35, this.y - 39, 70, 4);
            ctx.fillStyle = this.isStaggered ? '#ff0000' : '#ffaa00';
            ctx.fillRect(this.x - 35, this.y - 39, 70 * poisePercent, 4);
            ctx.strokeStyle = '#222222'; ctx.lineWidth = 1; ctx.strokeRect(this.x - 35, this.y - 39, 70, 4);

            ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
            if (this.isStaggered) {
                ctx.fillStyle = '#ffcc00'; ctx.fillText("STAGGERED (2x DMG)", this.x, this.y - 53);
            } else if (this.isEnraged) {
                ctx.fillStyle = '#ff3333'; ctx.fillText("🔥 ENRAGED BOSS", this.x, this.y - 53);
            } else {
                ctx.fillStyle = '#ffffff'; ctx.fillText("BOSS", this.x, this.y - 53);
            }
        } else {
            const hpPercent = this.hp / this.maxHp;
            ctx.fillStyle = 'red'; ctx.fillRect(this.x - 15, this.y - 25, 30, 4);
            ctx.fillStyle = '#00ff00'; ctx.fillRect(this.x - 15, this.y - 25, 30 * hpPercent, 4);

            if (this.isElite) {
                ctx.font = "8px Arial"; ctx.textAlign = "center";
                ctx.fillStyle = '#ffd700'; ctx.fillText("★ ELITE", this.x, this.y - 29);
            }
        }
    }
}

let player;

function spawnEnemy() {
    if (isPlaying) {
        // Cek Boss Monster tiap level 5, 10, 15, dst
        if (player.level > 0 && player.level % 5 === 0 && bossSpawnedForLevel !== player.level && !enemies.some(e => e.isBoss)) {
            bossSpawnedForLevel = player.level;
            // Spawn Boss dan bersihkan kroco
            enemies = enemies.filter(e => e.isBoss);
            let boss = new Enemy(canvas.width/2, -100, 'skeleton');
            boss.isBoss = true;
            // Nerf stat Boss biar nggak kemustahilan
            boss.hp = 200 + player.level * 50; boss.maxHp = boss.hp;
            boss.damage = 15 + player.level * 2; 
            boss.speed = 1.0; boss.xp = 300;
            boss.width = 60; boss.height = 60; // hitbox besar
            enemies.push(boss);
            floatingTexts.push(new FloatingText(canvas.width/2, canvas.height/2, "BOSS BATTLE!", "#ff0000", 40));
        } else if (enemies.length < Math.min(18, 5 + Math.floor(player.level * 0.9)) && !enemies.some(e => e.isBoss)) {
            let pool = ['slime', 'skeleton', 'bat', 'mage'];
            if (player.level >= 3) pool.push('charger');
            if (player.level >= 5) pool.push('shield', 'shield');
            if (player.level >= 8) pool.push('charger', 'shield');
            const type = pool[Math.floor(Math.random() * pool.length)];
            
            // Spawn di pinggir layar
            let x, y;
            if (Math.random() > 0.5) {
                x = Math.random() > 0.5 ? -50 : canvas.width + 50;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() > 0.5 ? -50 : canvas.height + 50;
            }
            enemies.push(new Enemy(x, y, type));
        }
    }
    
    // Timer interval spawn musuh yang seimbang
    setTimeout(spawnEnemy, Math.max(700, 1500 - player.level * 40));
}

function updateUI() {
    const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
    hpBar.style.width = `${hpPercent}%`;
    hpText.innerText = `${Math.floor(player.hp)}/${player.maxHp}`;
    
    const xpPercent = (player.xp / player.maxXp) * 100;
    xpBar.style.width = `${xpPercent}%`;
    levelText.innerText = player.level;
}

function drawBackground() {
    ctx.fillStyle = '#263a1e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2d4c24';
    for(let i=0; i<80; i++) {
        let gx = (i * 137) % canvas.width;
        let gy = (i * 91) % canvas.height;
        ctx.fillRect(gx, gy, 12, 6);
    }
}

function gameLoop(timestamp) {
    if (!isPlaying) return;

    player.update();
    enemies.forEach(e => e.update());
    particles.forEach(p => p.update());
    floatingTexts.forEach(f => f.update());
    loot.forEach(l => l.update());
    enemyProjectiles.forEach(ep => ep.update());
    playerProjectiles.forEach(pp => pp.update());
    bossShockwaves.forEach(bs => bs.update());

    particles = particles.filter(p => p.life > 0);
    floatingTexts = floatingTexts.filter(f => f.life > 0);
    enemyProjectiles = enemyProjectiles.filter(ep => ep.life > 0);
    playerProjectiles = playerProjectiles.filter(pp => pp.life > 0);
    bossShockwaves = bossShockwaves.filter(bs => bs.life > 0);

    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Efek Guncangan Layar (Screen Shake)
    if (screenShake > 0) {
        let sx = (Math.random() - 0.5) * screenShake;
        let sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.86;
        if (screenShake < 0.3) screenShake = 0;
    }

    drawBackground();
    
    // Sortir urutan gambar dari atas ke bawah Y (Efek 3D / Tumpuk)
    let renderList = [player, ...enemies, ...loot, ...enemyProjectiles, ...playerProjectiles, ...bossShockwaves, ...decorations];
    renderList.sort((a, b) => a.y - b.y);
    renderList.forEach(entity => entity.draw(ctx));
    
    particles.forEach(p => p.draw(ctx));
    floatingTexts.forEach(f => f.draw(ctx));

    ctx.restore();

    animationId = requestAnimationFrame(gameLoop);
}

let enemyProjectiles = [];
let playerProjectiles = [];
let bossShockwaves = [];

function startGame() {
    player = new Player(canvas.width/2, canvas.height/2);
    enemies = []; particles = []; floatingTexts = []; loot = []; enemyProjectiles = []; playerProjectiles = []; bossShockwaves = [];
    initDecorations();
    decorationsInitialized = true;
    coins = 0; coinText.innerText = coins;
    
    // Inisialisasi Audio (User Interaction)
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isPlaying = true;
    menuScreen.classList.add('hidden');
    updateUI();
    
    spawnEnemy();
    animationId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    isPlaying = false;
    cancelAnimationFrame(animationId);
    
    menuTitle.innerText = "GAME OVER";
    menuTitle.classList.replace('text-transparent', 'text-red-500');
    menuTitle.classList.replace('bg-gradient-to-r', 'bg-none');
    document.getElementById('menu-desc').innerHTML = `Level Reached: ${player.level} <br> Coins: ${coins}`;
    startBtn.innerText = "TRY AGAIN";
    menuScreen.classList.remove('hidden');
}

// Input Keyboard
window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space') { keys.attack = true; e.preventDefault(); }
    if (e.code === 'KeyF') { keys.magic = true; e.preventDefault(); }
    if (e.code === 'KeyB') {
        const shopScreen = document.getElementById('shop-screen');
        if (shopScreen.classList.contains('hidden')) openShop();
        else closeShop();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.up = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space') keys.attack = false;
    if (e.code === 'KeyF') keys.magic = false;
});

// Shop Logic
function updateShopUI() {
    if (!player) return;
    const shopCoinsDisplay = document.getElementById('shop-coins-display');
    if (shopCoinsDisplay) shopCoinsDisplay.innerText = coins;
    
    // Update Mini Status
    const elHp = document.getElementById('shop-stat-hp');
    const elAtk = document.getElementById('shop-stat-atk');
    const elWave = document.getElementById('shop-stat-wave');
    const elRange = document.getElementById('shop-stat-range');
    const elArmor = document.getElementById('shop-stat-armor');
    const elVamp = document.getElementById('shop-stat-vamp');

    if (elHp) elHp.innerText = `${Math.floor(player.hp)}/${player.maxHp}`;
    if (elAtk) elAtk.innerText = player.attackPower;
    if (elWave) elWave.innerText = player.swordWaveLevel >= 3 ? 'Lvl 3 (MAX)' : `Lvl ${player.swordWaveLevel}`;
    if (elRange) elRange.innerText = player.swordRangeLevel >= 4 ? 'Lvl 4 (MAX)' : `Lvl ${player.swordRangeLevel}`;
    if (elArmor) elArmor.innerText = `${player.armor} (${player.armor >= 10 ? 'MAX' : 'Lvl ' + (player.armor/2)})`;
    if (elVamp) elVamp.innerText = `+${player.lifesteal} HP`;

    // Update Wave Button
    const descWave = document.getElementById('shop-desc-wave');
    const costWave = document.getElementById('shop-cost-wave');
    if (player.swordWaveLevel === 1) {
        if (descWave) descWave.innerText = 'Tingkatkan ke Sabit Besar (Pierce 4)';
        if (costWave) costWave.innerText = '35 🪙';
    } else if (player.swordWaveLevel === 2) {
        if (descWave) descWave.innerText = 'Tingkatkan ke Triple Wave (3 Arah)';
        if (costWave) costWave.innerText = '50 🪙';
    } else {
        if (descWave) descWave.innerText = 'Triple Wave Active (MAX)';
        if (costWave) costWave.innerText = 'MAX';
    }

    // Update Range Button
    const descRange = document.getElementById('shop-desc-range');
    const costRange = document.getElementById('shop-cost-range');
    if (player.swordRangeLevel >= 4) {
        if (descRange) descRange.innerText = 'Jangkauan Tebasan Maksimal (MAX)';
        if (costRange) costRange.innerText = 'MAX';
    } else {
        if (descRange) descRange.innerText = `+20% Area Serang (Lvl ${player.swordRangeLevel}/4)`;
        if (costRange) costRange.innerText = '25 🪙';
    }

    // Update Armor Button
    const descArmor = document.getElementById('shop-desc-armor');
    const costArmor = document.getElementById('shop-cost-armor');
    if (player.armor >= 10) {
        if (descArmor) descArmor.innerText = 'Armor Maksimal (MAX)';
        if (costArmor) costArmor.innerText = 'MAX';
    } else {
        if (descArmor) descArmor.innerText = `-2 Damage Diterima (Lvl ${player.armor/2}/5)`;
        if (costArmor) costArmor.innerText = '25 🪙';
    }

    // Update Vamp Button
    const descVamp = document.getElementById('shop-desc-vamp');
    const costVamp = document.getElementById('shop-cost-vamp');
    if (player.lifesteal >= 6) {
        if (descVamp) descVamp.innerText = 'Vampire Maksimal (MAX)';
        if (costVamp) costVamp.innerText = 'MAX';
    } else {
        if (descVamp) descVamp.innerText = `+2 HP Tiap Musuh Mati (Lvl ${player.lifesteal/2}/3)`;
        if (costVamp) costVamp.innerText = '35 🪙';
    }
}

function openShop() {
    if (!isPlaying) return;
    const shopScreen = document.getElementById('shop-screen');
    shopScreen.classList.remove('hidden');
    shopScreen.classList.add('flex');
    updateShopUI();
    isPlaying = false; // Pause game while in shop
}

function closeShop() {
    const shopScreen = document.getElementById('shop-screen');
    shopScreen.classList.remove('flex');
    shopScreen.classList.add('hidden');
    isPlaying = true;
    requestAnimationFrame(gameLoop);
}

document.getElementById('shop-btn-ui').addEventListener('click', openShop);
document.getElementById('close-shop').addEventListener('click', closeShop);

document.getElementById('buy-hp').addEventListener('click', () => {
    if (coins >= 10 && player.hp < player.maxHp) {
        coins -= 10; 
        player.hp = Math.min(player.maxHp, player.hp + 60);
        coinText.innerText = coins; 
        playSound('coin');
        updateUI();
        updateShopUI();
    }
});

document.getElementById('buy-maxhp').addEventListener('click', () => {
    if (coins >= 30) {
        coins -= 30; 
        player.maxHp += 30; 
        player.hp = player.maxHp; // Full heal bonus!
        coinText.innerText = coins; 
        playSound('coin');
        updateUI();
        updateShopUI();
    }
});

document.getElementById('buy-atk').addEventListener('click', () => {
    if (coins >= 25) {
        coins -= 25; 
        player.attackPower += 5;
        coinText.innerText = coins; 
        playSound('coin');
        updateShopUI();
    }
});

document.getElementById('buy-wave').addEventListener('click', () => {
    let cost = player.swordWaveLevel === 1 ? 35 : (player.swordWaveLevel === 2 ? 50 : 9999);
    if (player.swordWaveLevel < 3 && coins >= cost) {
        coins -= cost;
        player.swordWaveLevel++;
        coinText.innerText = coins;
        playSound('coin');
        updateShopUI();
    }
});

document.getElementById('buy-range').addEventListener('click', () => {
    if (player.swordRangeLevel < 4 && coins >= 25) {
        coins -= 25;
        player.swordRangeLevel++;
        coinText.innerText = coins;
        playSound('coin');
        updateShopUI();
    }
});

document.getElementById('buy-armor').addEventListener('click', () => {
    if (player.armor < 10 && coins >= 25) {
        coins -= 25;
        player.armor += 2;
        coinText.innerText = coins;
        playSound('coin');
        updateShopUI();
    }
});

document.getElementById('buy-vamp').addEventListener('click', () => {
    if (player.lifesteal < 6 && coins >= 35) {
        coins -= 35;
        player.lifesteal += 2;
        coinText.innerText = coins;
        playSound('coin');
        updateShopUI();
    }
});

// Mobile Input
function bindBtn(id, keyProp) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    btn.addEventListener('mousedown', (e) => { keys[keyProp] = true; });
    btn.addEventListener('mouseup', (e) => { keys[keyProp] = false; });
    btn.addEventListener('mouseleave', (e) => { keys[keyProp] = false; });
}
bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down');
bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');
bindBtn('btn-attack', 'attack');

startBtn.addEventListener('click', startGame);

</script>
