<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Knight Action RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Khusus untuk mematikan seleksi teks agar nyaman dimainkan di HP */
        body { touch-action: none; user-select: none; -webkit-user-select: none; }
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        .bar-transition { transition: width 0.2s ease-out; }
    </style>
</head>
<body class="bg-gray-900 h-screen w-screen overflow-hidden flex items-center justify-center">

<div id="game-container" class="relative w-full max-w-4xl h-full max-h-[800px] bg-black shadow-2xl overflow-hidden sm:rounded-xl sm:border-4 border-gray-700">
    
    <!-- UI Overlay: Status Player -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start z-10 pointer-events-none">
        <div class="flex flex-col gap-2 w-1/2 max-w-xs">
            <!-- HP Bar -->
            <div class="flex items-center gap-2">
                <span class="text-red-500 font-bold pixel-font text-[10px]">HP</span>
                <div class="w-full h-4 bg-gray-800 rounded border-2 border-gray-600 relative overflow-hidden">
                    <div id="hp-bar" class="h-full bg-red-500 bar-transition w-full"></div>
                </div>
                <span id="hp-text" class="text-white pixel-font text-[8px]">100/100</span>
            </div>
            <!-- XP Bar -->
            <div class="flex items-center gap-2">
                <span class="text-blue-400 font-bold pixel-font text-[10px]">XP</span>
                <div class="w-full h-3 bg-gray-800 rounded border-2 border-gray-600 relative overflow-hidden">
                    <div id="xp-bar" class="h-full bg-blue-500 bar-transition w-0"></div>
                </div>
            </div>
        </div>
        
        <!-- Stats Kanan: Level & Koin -->
        <div class="flex flex-col items-end gap-2 text-white pixel-font text-xs text-shadow pointer-events-auto">
            <button id="shop-btn-ui" class="bg-purple-700/80 hover:bg-purple-600 px-3 py-1 rounded border-2 border-purple-500 animate-pulse cursor-pointer">
                🛒 SHOP (B)
            </button>
            <div class="bg-gray-800/80 px-3 py-1 rounded border-2 border-gray-600">
                LVL <span id="level-text" class="text-yellow-400">1</span>
            </div>
            <div class="bg-gray-800/80 px-3 py-1 rounded border-2 border-gray-600 flex items-center gap-1">
                🪙 <span id="coin-text" class="text-yellow-400">0</span>
            </div>
        </div>
        
        <!-- Skill Cooldown UI -->
        <div class="absolute top-20 left-4 bg-gray-900/80 p-2 rounded pixel-font text-white border-2 border-purple-500 w-32 shadow pointer-events-none">
            <div class="text-[10px] mb-1 text-center">SKILL [F]</div>
            <div class="w-full h-3 bg-gray-800 rounded overflow-hidden border border-gray-600 mb-1">
                <div id="skill-bar" class="h-full bg-purple-500 transition-all duration-200" style="width: 100%"></div>
            </div>
            <div id="skill-text" class="text-center text-[10px] text-purple-300">READY!</div>
        </div>
    </div>

    <!-- Teks Level Up -->
    <div id="level-up-msg" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-yellow-300 pixel-font text-2xl z-20 hidden text-center drop-shadow-[0_5px_5px_rgba(0,0,0,1)]">
        LEVEL UP!
    </div>

    <!-- Canvas Utama -->
    <canvas id="gameCanvas" class="block w-full h-full"></canvas>

    <!-- Kontrol Sentuh (Mobile) -->
    <div id="mobile-controls" class="absolute bottom-4 left-0 w-full px-6 flex justify-between items-end z-10 sm:hidden">
        <!-- D-Pad Kiri -->
        <div class="grid grid-cols-3 gap-2 w-32 h-32">
            <div></div>
            <button id="btn-up" class="bg-gray-700/50 rounded-full active:bg-gray-500 border border-gray-500 flex items-center justify-center text-white pb-1">▲</button>
            <div></div>
            <button id="btn-left" class="bg-gray-700/50 rounded-full active:bg-gray-500 border border-gray-500 flex items-center justify-center text-white pb-1">◀</button>
            <div class="bg-gray-800/30 rounded-full"></div>
            <button id="btn-right" class="bg-gray-700/50 rounded-full active:bg-gray-500 border border-gray-500 flex items-center justify-center text-white pb-1">▶</button>
            <div></div>
            <button id="btn-down" class="bg-gray-700/50 rounded-full active:bg-gray-500 border border-gray-500 flex items-center justify-center text-white pb-1">▼</button>
            <div></div>
        </div>
        
        <!-- Tombol Aksi Kanan -->
        <button id="btn-attack" class="w-16 h-16 bg-red-600/70 rounded-full active:bg-red-400 border-2 border-red-800 flex items-center justify-center text-white font-bold pixel-font text-[10px] mb-2 mr-2">
            ATK
        </button>
    </div>

    <!-- Layar Start / Game Over -->
    <div id="menu-screen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-30">
        <h1 id="menu-title" class="text-4xl md:text-5xl text-white pixel-font mb-4 text-center text-shadow-lg leading-relaxed text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">PIXEL KNIGHT</h1>
        <p id="menu-desc" class="text-gray-400 mb-8 pixel-font text-[10px] md:text-xs text-center max-w-sm leading-loose">
            WASD / Arrow Keys to Move<br><br>SPACE to Attack 4 Directions
        </p>
        <button id="start-btn" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white pixel-font text-sm rounded border-4 border-red-800 transition transform hover:scale-105 active:scale-95">
            START GAME
        </button>
    </div>

    <!-- Shop Screen -->
    <div id="shop-screen" class="absolute inset-0 bg-black/95 hidden flex-col items-center justify-center z-40 text-white pixel-font p-3 sm:p-6 overflow-y-auto">
        <h2 class="text-2xl sm:text-4xl mb-2 text-yellow-400 text-shadow-lg tracking-wider text-center">🏪 BLACKSMITH SHOP</h2>
        <div class="mb-3 text-xs sm:text-sm text-gray-300">
            Coins: <span id="shop-coins-display" class="text-yellow-300 text-base sm:text-lg">0</span> 🪙
        </div>
        
        <!-- Player Mini Status inside Shop -->
        <div id="shop-stats-bar" class="mb-4 text-[9px] sm:text-[10px] text-gray-300 flex flex-wrap justify-center gap-2 bg-gray-900/90 p-2.5 rounded border border-gray-700 max-w-xl w-full">
            <span>HP: <b id="shop-stat-hp" class="text-red-400">100/100</b></span> |
            <span>ATK: <b id="shop-stat-atk" class="text-orange-400">15</b></span> |
            <span>Wave: <b id="shop-stat-wave" class="text-cyan-400">Lvl 1</b></span> |
            <span>Range: <b id="shop-stat-range" class="text-yellow-400">Lvl 0</b></span> |
            <span>Armor: <b id="shop-stat-armor" class="text-blue-400">0</b></span> |
            <span>Vamp: <b id="shop-stat-vamp" class="text-emerald-400">0</b></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3 w-full max-w-xl text-left text-[10px] sm:text-xs">
            <!-- Potion -->
            <button id="buy-hp" class="p-2 sm:p-3 bg-green-700 hover:bg-green-600 rounded border-2 border-green-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">🧪 Health Potion</div>
                    <div class="text-[9px] text-green-200">Pulihkan +60 HP</div>
                </div>
                <div class="text-yellow-300 font-bold ml-2">10 🪙</div>
            </button>

            <!-- Max HP -->
            <button id="buy-maxhp" class="p-2 sm:p-3 bg-blue-700 hover:bg-blue-600 rounded border-2 border-blue-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">❤️ Boost Max HP</div>
                    <div class="text-[9px] text-blue-200">+30 Max HP & Full Heal</div>
                </div>
                <div class="text-yellow-300 font-bold ml-2">30 🪙</div>
            </button>

            <!-- ATK Upgrade -->
            <button id="buy-atk" class="p-2 sm:p-3 bg-red-700 hover:bg-red-600 rounded border-2 border-red-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">⚔️ Upgrade Pedang</div>
                    <div class="text-[9px] text-red-200">+5 Attack Damage</div>
                </div>
                <div class="text-yellow-300 font-bold ml-2">25 🪙</div>
            </button>

            <!-- Sword Wave (Projectile) -->
            <button id="buy-wave" class="p-2 sm:p-3 bg-cyan-700 hover:bg-cyan-600 rounded border-2 border-cyan-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">🌊 Sword Wave Proyektil</div>
                    <div id="shop-desc-wave" class="text-[9px] text-cyan-200">Tingkatkan Gelombang Sabit</div>
                </div>
                <div id="shop-cost-wave" class="text-yellow-300 font-bold ml-2">35 🪙</div>
            </button>

            <!-- Sword Range / AoE -->
            <button id="buy-range" class="p-2 sm:p-3 bg-amber-700 hover:bg-amber-600 rounded border-2 border-amber-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">🌪️ Jangkauan Tebas (AoE)</div>
                    <div id="shop-desc-range" class="text-[9px] text-amber-200">+20% Area Serangan</div>
                </div>
                <div id="shop-cost-range" class="text-yellow-300 font-bold ml-2">25 🪙</div>
            </button>

            <!-- Armor / Def -->
            <button id="buy-armor" class="p-2 sm:p-3 bg-indigo-700 hover:bg-indigo-600 rounded border-2 border-indigo-500 transition transform hover:scale-[1.02] flex items-center justify-between">
                <div>
                    <div class="text-white font-bold">🛡️ Iron Armor (Def)</div>
                    <div id="shop-desc-armor" class="text-[9px] text-indigo-200">-2 Damage Tiap Serangan</div>
                </div>
                <div id="shop-cost-armor" class="text-yellow-300 font-bold ml-2">25 🪙</div>
            </button>

            <!-- Lifesteal / Vampire -->
            <button id="buy-vamp" class="p-2 sm:p-3 bg-purple-700 hover:bg-purple-600 rounded border-2 border-purple-500 transition transform hover:scale-[1.02] flex items-center justify-between sm:col-span-2">
                <div>
                    <div class="text-white font-bold">🩸 Vampire Rune</div>
                    <div id="shop-desc-vamp" class="text-[9px] text-purple-200">+2 HP Tiap Monster Mati</div>
                </div>
                <div id="shop-cost-vamp" class="text-yellow-300 font-bold ml-2">35 🪙</div>
            </button>
        </div>
        
        <button id="close-shop" class="mt-4 px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded border-2 border-gray-500 text-xs transition">Close Shop (B)</button>
    </div>

</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI Elements
const hpBar = document.getElementById('hp-bar');
const hpText = document.getElementById('hp-text');
const xpBar = document.getElementById('xp-bar');
const levelText = document.getElementById('level-text');
const coinText = document.getElementById('coin-text');
const levelUpMsg = document.getElementById('level-up-msg');
const menuScreen = document.getElementById('menu-screen');
const menuTitle = document.getElementById('menu-title');
const startBtn = document.getElementById('start-btn');
const mobileControls = document.getElementById('mobile-controls');

// Game State
let isPlaying = false;
let animationId;
let keys = { up: false, down: false, left: false, right: false, attack: false };
let coins = 0;

// Collections
let enemies = [];
let particles = [];
let floatingTexts = [];
let loot = [];
let bossSpawnedForLevel = 0;
let decorations = [];

// --- ASSETS LOAD (Sesuai nama file dari user) ---
const imgPlayer = new Image();
imgPlayer.src = 'player.png';

const imgEntities = new Image();
imgEntities.src = 'entities.png';

const imgBoss = new Image();
imgBoss.src = 'boss.png';

// Fungsi Helper untuk memotong gambar berdasarkan persentase (Biar responsif di ukuran gambar apapun)
function drawSpriteProportional(ctx, img, pX, pY, pW, pH, dx, dy, dw, dh) {
    if (!img.complete || img.naturalWidth === 0) return false;
    let sx = img.naturalWidth * pX;
    let sy = img.naturalHeight * pY;
    let sw = img.naturalWidth * pW;
    let sh = img.naturalHeight * pH;
    
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    
    return true;
}

let decorationsInitialized = false;

// Resize Canvas
function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (window.innerWidth <= 640) mobileControls.classList.remove('hidden');
    
    if (decorationsInitialized) {
        initDecorations();
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Web Audio API SFX
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let screenShake = 0;
function triggerScreenShake(amount) {
    screenShake = Math.max(screenShake, amount);
}

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'magic') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'level') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wave') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === 'parry') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.04);
        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.start(); osc.stop(audioCtx.currentTime + 0.16);
    } else if (type === 'shatter') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }
}

class FloatingText {
    constructor(x, y, text, color, size = 16) {
        this.x = x; this.y = y; this.text = text;
        this.color = color; this.life = 1.0;
        this.size = size; this.velocity = -1;
    }
    update() { this.y += this.velocity; this.life -= 0.02; }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.size}px 'Press Start 2P', monospace`;
        ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0; this.size = Math.random() * 4 + 2;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life -= 0.05;
    }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

class CoinLoot {
    constructor(x, y, value = 1) {
        this.x = x; this.y = y; this.value = value;
        this.radius = 12; this.vy = -4; 
        this.vx = (Math.random() - 0.5) * 4;
        this.bounce = 2;
        this.magnetized = false; // Magnet effect
    }
    update() {
        // Efek Magnet ke Player
        const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
        if (distToPlayer < 100) {
            this.magnetized = true;
        }

        if (this.magnetized) {
            // Bergerak mendekati player otomatis
            const angle = Math.atan2(player.y - this.y, player.x - this.x);
            this.x += Math.cos(angle) * 8; // Kecepatan magnet
            this.y += Math.sin(angle) * 8;
        } else if (this.bounce > 0) {
            // Animasi lompat saat jatuh
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.3; // gravity
            if (this.vy > 3) {
                this.vy = -2.5; this.bounce--; this.vx *= 0.5;
            }
        }
    }
    draw(ctx) {
        // Animasi koin memutar
        const frameIdx = Math.floor(Date.now() / 150) % 4;
        
        // Ambil Koin dari gambar Entities baris koin (sekitar Y: 48%, X: 0-35%)
        let drawn = drawSpriteProportional(ctx, imgEntities, 
            0 + (frameIdx * 0.0875), 0.48, 0.0875, 0.14, // Source proportions
            this.x - 12, this.y - 12, 24, 24             // Destination pixels
        );

        if (!drawn) {
            // Fallback Emoji jika gambar gagal dimuat
            ctx.font = "16px Arial"; ctx.fillText("🪙", this.x - 8, this.y + 8);
        }
    }
}

class ItemLoot {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.radius = 12; this.vy = -4; 
        this.vx = (Math.random() - 0.5) * 4;
        this.bounce = 2;
    }
    update() {
        if (this.bounce > 0) {
            this.x += this.vx; this.y += this.vy; this.vy += 0.3;
            if (this.vy > 3) { this.vy = -2.5; this.bounce--; this.vx *= 0.5; }
        }
    }
    draw(ctx) {
        // Animasi floating sedikit
        const floatY = Math.sin(Date.now() / 200) * 4;
        
        ctx.save();
        ctx.font = "24px Arial"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        ctx.shadowBlur = 10;
        ctx.fillText(this.type === 'heart' ? "❤️" : "🗡️", this.x, this.y + floatY); 
        ctx.restore();
    }
}

class EnemyProjectile {
    constructor(x, y, dx, dy, damage) {
        this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.damage = damage;
        this.life = 120; this.radius = 8;
        this.isReflected = false;
    }
    update() {
        this.x += this.dx; this.y += this.dy; this.life--;
        
        // Cek tangkisan pedang
        if (!this.isReflected && player && player.isAttacking) {
            const dist = Math.hypot(this.x - player.x, this.y - player.y);
            const parryRange = 60 + (player.swordRangeLevel || 0) * 15;
            if (dist < parryRange) {
                this.isReflected = true;
                this.dx = -this.dx * 1.5;
                this.dy = -this.dy * 1.5;
                this.life = 120;
                playSound('hit');
                for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, '#ffffff'));
            }
        }

        if (this.isReflected) {
            for (let i=0; i<enemies.length; i++) {
                const e = enemies[i];
                const dist = Math.hypot(this.x - e.x, this.y - e.y);
                if (dist < this.radius + e.width/2) {
                    e.takeDamage(this.damage * 3); // Mantul damage x3
                    this.life = 0;
                    break;
                }
            }
        } else {
            const dist = Math.hypot(this.x - player.x, this.y - player.y);
            if (dist < this.radius + player.width/2) {
                player.takeDamage(this.damage);
                for(let i=0; i<5; i++) particles.push(new Particle(this.x, this.y, '#ff8800'));
                this.life = 0;
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.isReflected ? '#00ffff' : '#ff8800'; 
        ctx.shadowColor = this.isReflected ? '#00ffff' : '#ff0000'; 
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

class PlayerProjectile {
    constructor(x, y, vx, vy, damage, size = 18, pierce = 2, angle = 0) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.damage = damage;
        this.size = size;
        this.pierce = pierce;
        this.angle = angle;
        this.life = 75; // Jangkauan terbang proyektil (~1.2 detik)
        this.hitEnemies = new Set();
        this.isBossReflected = false;
        this.rallyCount = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;

        // Jejak partikel energi
        if (this.isBossReflected) {
            if (Math.random() < 0.5) particles.push(new Particle(this.x, this.y, '#ff0055'));
        } else if (this.rallyCount > 0) {
            if (Math.random() < 0.5) particles.push(new Particle(this.x, this.y, '#ffd700'));
        } else {
            if (Math.random() < 0.35) particles.push(new Particle(this.x, this.y, '#38bdf8'));
        }

        // JIKA SEDANG DIPARRY BOSS (TERBANG MENUJU PLAYER)
        if (this.isBossReflected) {
            const distToPlayer = Math.hypot(this.x - player.x, this.y - player.y);
            if (distToPlayer < this.size + (player.width / 2) + 14) {
                // Player melakukan Counter-Parry jika sedang mengayunkan pedang!
                if (player.isAttacking) {
                    this.isBossReflected = false;
                    this.rallyCount++;
                    this.life = 85;
                    this.hitEnemies.clear();

                    // Cari target Boss jika ada
                    const boss = enemies.find(e => e.isBoss && e.hp > 0);
                    let targetAng = this.angle + Math.PI;
                    if (boss) {
                        targetAng = Math.atan2(boss.y - this.y, boss.x - this.x);
                    }

                    // Escalating speed & damage per rally!
                    let currentSpeed = Math.min(22, Math.hypot(this.vx, this.vy) * 1.25);
                    this.vx = Math.cos(targetAng) * currentSpeed;
                    this.vy = Math.sin(targetAng) * currentSpeed;
                    this.angle = targetAng;
                    this.damage = Math.floor(this.damage * 1.5);

                    playSound('parry');
                    triggerScreenShake(8 + Math.min(10, this.rallyCount * 2));
                    floatingTexts.push(new FloatingText(player.x, player.y - 30, `PERFECT PARRY! x${this.rallyCount}`, "#ffd700", 20));
                    for (let p = 0; p < 15; p++) particles.push(new Particle(this.x, this.y, '#ffd700'));
                    return;
                } else {
                    // Kena Player!
                    player.takeDamage(this.damage);
                    playSound('hit');
                    triggerScreenShake(7);
                    for (let p = 0; p < 8; p++) particles.push(new Particle(this.x, this.y, '#ff0055'));
                    this.life = 0;
                    return;
                }
            }
            return; // Jangan tabrak musuh saat proyektil sedang dikontrol boss
        }

        // Cek tabrakan dengan musuh (Proyektil milik Player)
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (this.hitEnemies.has(e)) continue;

            const dist = Math.hypot(this.x - e.x, this.y - e.y);
            if (dist < this.size + (e.width / 2)) {
                this.hitEnemies.add(e);

                // Cek apakah Boss mem-parry proyektil ini!
                if (e.isBoss && !e.isStaggered && e.bossState !== 'die') {
                    let parryChance = e.isEnraged ? 0.65 : 0.40;
                    if (this.rallyCount >= 3) parryChance = 0.25;
                    if (this.rallyCount >= 6) parryChance = 0.05;

                    if (Math.random() < parryChance) {
                        this.isBossReflected = true;
                        this.rallyCount++;
                        this.life = 85;
                        this.hitEnemies.clear();

                        // Boss memantulkan proyektil kembali ke arah player!
                        let toPlayerAng = Math.atan2(player.y - e.y, player.x - e.x);
                        let currentSpeed = Math.min(20, Math.hypot(this.vx, this.vy) * 1.2);
                        this.vx = Math.cos(toPlayerAng) * currentSpeed;
                        this.vy = Math.sin(toPlayerAng) * currentSpeed;
                        this.angle = toPlayerAng;
                        this.damage = Math.floor(this.damage * 1.35);

                        playSound('parry');
                        triggerScreenShake(7 + Math.min(8, this.rallyCount * 2));
                        floatingTexts.push(new FloatingText(e.x, e.y - 50, "BOSS PARRIED!", "#ff0055", 22));
                        for (let p = 0; p < 12; p++) particles.push(new Particle(this.x, this.y, '#ff0055'));
                        e.bossState = 'attack';
                        e.stateTimer = 0;
                        return; // Hindari damage karena serangan berhasil diparry Boss!
                    }
                }

                // Cek apakah musuh bertameng dan terkena dari arah depan
                if (e.hasShield) {
                    let hitFromFront = false;
                    if (player.x < e.x && this.vx > 0) hitFromFront = true;
                    else if (player.x > e.x && this.vx < 0) hitFromFront = true;
                    else if (Math.abs(this.vy) > Math.abs(this.vx)) hitFromFront = true;

                    if (hitFromFront) {
                        playSound('hit');
                        for (let p = 0; p < 6; p++) particles.push(new Particle(this.x, this.y, '#ffffff'));
                        floatingTexts.push(new FloatingText(e.x, e.y - 20, "BLOCKED!", "#ffd700", 14));
                        this.life = 0;
                        break;
                    }
                }

                // Jika hasil dari Rally, berikan visual & Poise damage masif ke Boss!
                if (this.rallyCount > 0) {
                    floatingTexts.push(new FloatingText(e.x, e.y - 35, `RALLY SMASH! x${this.rallyCount}`, "#ffd700", 22));
                    triggerScreenShake(9);
                    for (let p = 0; p < 12; p++) particles.push(new Particle(e.x, e.y, '#ffd700'));
                    if (e.isBoss) {
                        e.takePoiseDamage(35 + this.rallyCount * 12);
                    }
                } else if (e.isBoss) {
                    e.takePoiseDamage(10);
                }

                e.takeDamage(this.damage);
                playSound('hit');

                // Knockback peluru
                let res = e.isBoss ? 0.2 : (e.isElite ? 0.35 : 0.8);
                let dirX = this.vx !== 0 ? Math.sign(this.vx) : 0;
                let dirY = this.vy !== 0 ? Math.sign(this.vy) : 0;
                e.x += dirX * 12 * res;
                e.y += dirY * 12 * res;

                // Percikan efek hit proyektil
                for (let p = 0; p < 4; p++) {
                    particles.push(new Particle(e.x, e.y, this.rallyCount > 0 ? '#ffd700' : '#00ffff'));
                }

                this.pierce--;
                if (this.pierce <= 0) {
                    this.life = 0;
                    break;
                }
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        let outerColor = '#38bdf8';
        let glowColor = '#00ffff';
        let innerColor = '#ffffff';

        if (this.isBossReflected) {
            outerColor = '#ff0055';
            glowColor = '#ff0033';
            innerColor = '#ffcc00';
        } else if (this.rallyCount > 0) {
            outerColor = '#ffd700';
            glowColor = '#ffaa00';
            innerColor = '#ffffff';
        }

        // Efek glowing crescent wave
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 14;

        // Sabit luar
        ctx.strokeStyle = outerColor;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, this.size, -Math.PI / 2.8, Math.PI / 2.8);
        ctx.stroke();

        // Inti putih
        ctx.shadowBlur = 0;
        ctx.strokeStyle = innerColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.size - 2, -Math.PI / 3.5, Math.PI / 3.5);
        ctx.stroke();

        ctx.restore();
    }
}

class Shockwave {
    constructor(x, y) {
        this.x = x; this.y = y; this.radius = 10; this.maxRadius = 150;
        this.life = 1.0;
    }
    update() {
        this.radius += 10;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.strokeStyle = '#9900ff';
        ctx.lineWidth = 10;
        ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(153, 0, 255, 0.2)';
        ctx.fill();
        ctx.restore();
    }
}

class BossShockwave {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = 15;
        this.maxRadius = 220;
        this.damage = 18;
        this.hitPlayer = false;
        this.life = 1.0;
    }
    update() {
        this.radius += 5;
        this.life = Math.max(0, 1.0 - (this.radius / this.maxRadius));
        
        // Cek tabrakan dengan player
        if (!this.hitPlayer && player) {
            const dist = Math.hypot(this.x - player.x, this.y - player.y);
            // Kena jika berada di garis cincin shockwave
            if (Math.abs(dist - this.radius) < 18) {
                this.hitPlayer = true;
                player.takeDamage(this.damage);
                playSound('hit');
                const ang = Math.atan2(player.y - this.y, player.x - this.x);
                player.x += Math.cos(ang) * 20;
                player.y += Math.sin(ang) * 20;
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.strokeStyle = '#ff3333';
        ctx.lineWidth = 8;
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.width = 30; this.height = 40; this.speed = 3.5;
        
        // Stats
        this.maxHp = 100; this.hp = 100;
        this.level = 1; this.xp = 0; this.maxXp = 50;
        this.attackPower = 15;

        // Upgradeable Perks
        this.swordWaveLevel = 1; // 1 = Sabit Dasar, 2 = Mega Pierce Wave, 3 = Triple Spread Wave
        this.swordRangeLevel = 0; // Jangkauan tebasan (0 - 4)
        this.armor = 0; // Pengurang damage (0 - 10)
        this.lifesteal = 0; // HP recovery per kill (0 - 6)
        this.invincibleTimer = 0; // i-frame invulnerability
        
        // Combat State
        this.isAttacking = false;
        this.attackCooldown = 0;
        this.comboStep = 0; // Combo 1 -> 2 -> 3 (Finisher)
        this.lastAttackTime = 0;
        this.magicCooldownMax = 300; // 5 Detik buat skill AoE
        this.magicCooldown = 0; // Cooldown sihir
        this.visualFacing = 'right'; // Untuk arah hadap gambar karakter
        this.aimDirection = 'right'; // Untuk arah tebasan pedang (up, down, left, right)
    }

    update() {
        if (this.hp <= 0) return;
        if (this.invincibleTimer > 0) this.invincibleTimer--;

        // Movement & Menentukan Arah Tebasan (Aim)
        let dx = 0; let dy = 0;
        
        if (keys.left) { dx -= this.speed; this.visualFacing = 'left'; this.aimDirection = 'left'; }
        else if (keys.right) { dx += this.speed; this.visualFacing = 'right'; this.aimDirection = 'right'; }
        
        if (keys.up) { dy -= this.speed; this.aimDirection = 'up'; }
        else if (keys.down) { dy += this.speed; this.aimDirection = 'down'; }
        
        // Normalize diagonal speed
        if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

        // Boundary check
        this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x + dx));
        this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y + dy));

        // Attack Logic
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (keys.attack && this.attackCooldown === 0) this.attack();
        
        // Super Skill Logic (Key F)
        let skillBar = document.getElementById('skill-bar');
        let skillText = document.getElementById('skill-text');
        
        if (this.magicCooldown > 0) {
            this.magicCooldown--;
            let pct = ((this.magicCooldownMax - this.magicCooldown) / this.magicCooldownMax) * 100;
            if (skillBar) skillBar.style.width = pct + '%';
            if (skillText) {
                skillText.innerText = 'COOLDOWN';
                skillText.classList.replace('text-purple-300', 'text-gray-400');
            }
        } else {
            if (skillBar) skillBar.style.width = '100%';
            if (skillText) {
                skillText.innerText = 'READY!';
                skillText.classList.replace('text-gray-400', 'text-purple-300');
            }
        }

        if (keys.magic && this.magicCooldown === 0) {
            this.superSkill();
        }

        // Check Loot pickup
        for (let i = loot.length - 1; i >= 0; i--) {
            const l = loot[i];
            const dist = Math.hypot(this.x - l.x, this.y - l.y);
            if (dist < this.width + l.radius) {
                if (l instanceof CoinLoot) {
                    coins += l.value;
                    coinText.innerText = coins;
                    playSound('coin');
                    floatingTexts.push(new FloatingText(this.x, this.y - 20, `+${l.value} Coin`, "#ffd700", 12));
                } else if (l.type === 'heart') {
                    let heal = 30;
                    this.hp = Math.min(this.maxHp, this.hp + heal);
                    playSound('coin');
                    floatingTexts.push(new FloatingText(this.x, this.y - 20, `+${heal} HP`, "#00ff00", 12));
                    updateUI();
                } else if (l.type === 'sword') {
                    this.attackPower += 2;
                    playSound('coin');
                    floatingTexts.push(new FloatingText(this.x, this.y - 20, "ATK UP!", "#ffaa00", 12));
                }
                loot.splice(i, 1);
            }
        }
    }

    attack() {
        this.isAttacking = true;
        this.attackCooldown = 18; // Kecepatan serang kombo responsif
        
        let now = Date.now();
        if (now - this.lastAttackTime > 900) {
            this.comboStep = 0;
        }
        this.comboStep = (this.comboStep % 3) + 1; // 1, 2, 3
        this.lastAttackTime = now;

        let comboBonus = this.comboStep === 2 ? 15 : (this.comboStep === 3 ? 30 : 0);
        const hitRange = 75 + this.swordRangeLevel * 20 + comboBonus;
        const hitWidth = 85 + this.swordRangeLevel * 22 + comboBonus;
        
        let hitbox = { x: 0, y: 0, w: 0, h: 0 };
        let knockX = 0, knockY = 0;
        let knockPower = this.comboStep === 3 ? 35 : (this.comboStep === 2 ? 26 : 18);

        // Menyesuaikan posisi serangan berdasarkan 4 arah
        if (this.aimDirection === 'right') {
            hitbox = { x: this.x - 15, y: this.y - hitWidth/2, w: hitRange + 15, h: hitWidth };
            knockX = knockPower;
        } else if (this.aimDirection === 'left') {
            hitbox = { x: this.x - hitRange, y: this.y - hitWidth/2, w: hitRange + 15, h: hitWidth };
            knockX = -knockPower;
        } else if (this.aimDirection === 'up') {
            hitbox = { x: this.x - hitWidth/2, y: this.y - hitRange, w: hitWidth, h: hitRange + 15 };
            knockY = -knockPower;
        } else if (this.aimDirection === 'down') {
            hitbox = { x: this.x - hitWidth/2, y: this.y - 15, w: hitWidth, h: hitRange + 15 };
            knockY = knockPower;
        }

        // Damage ke musuh yang kena Hitbox
        enemies.forEach(enemy => {
            if (enemy.x >= hitbox.x && enemy.x <= hitbox.x + hitbox.w &&
                enemy.y >= hitbox.y && enemy.y <= hitbox.y + hitbox.h) {
                
                // Cek jika musuh adalah Boss dan menangkis serangan melee (Melee Clank!)
                if (enemy.isBoss && !enemy.isStaggered && enemy.bossState !== 'die' && Math.random() < 0.25) {
                    playSound('parry');
                    triggerScreenShake(6);
                    floatingTexts.push(new FloatingText(enemy.x, enemy.y - 30, "CLANK! BLOCKED", "#ffffff", 18));
                    for (let p = 0; p < 10; p++) particles.push(new Particle((this.x + enemy.x)/2, (this.y + enemy.y)/2, '#ffffbb'));
                    // Recoil ke pemain
                    this.x -= knockX * 0.7;
                    this.y -= knockY * 0.7;
                    enemy.takePoiseDamage(12);
                    return;
                }

                let comboMultiplier = this.comboStep === 3 ? 1.5 : (this.comboStep === 2 ? 1.2 : 1.0);
                let dmg = Math.floor((this.attackPower + Math.floor(Math.random() * 5)) * comboMultiplier);
                
                if (enemy.isBoss) {
                    enemy.takePoiseDamage(this.comboStep === 3 ? 18 : 10);
                }

                enemy.takeDamage(dmg);
                playSound('hit');
                let res = enemy.isBoss ? 0.2 : (enemy.isElite ? 0.35 : 1.0);
                enemy.x += knockX * res;
                enemy.y += knockY * res;
            }
        });

        // Combo ke-3 melepaskan Finisher Sword Wave!
        if (this.comboStep === 3) {
            if (this.swordWaveLevel > 0) {
                this.shootSwordWave();
            }
            floatingTexts.push(new FloatingText(this.x, this.y - 35, "FINISHER BLAST!", "#38bdf8", 15));
            for(let p=0; p<8; p++) particles.push(new Particle(this.x, this.y, '#38bdf8'));
        }

        setTimeout(() => { this.isAttacking = false; }, 140);
    }

    shootSwordWave() {
        let baseAngle = 0;
        let startX = this.x;
        let startY = this.y;
        
        if (this.aimDirection === 'right') { baseAngle = 0; startX += 20; }
        else if (this.aimDirection === 'down') { baseAngle = Math.PI / 2; startY += 20; }
        else if (this.aimDirection === 'left') { baseAngle = Math.PI; startX -= 20; }
        else if (this.aimDirection === 'up') { baseAngle = -Math.PI / 2; startY -= 20; }

        playSound('wave');
        const speed = 8.5;

        if (this.swordWaveLevel === 1) {
            let vx = Math.cos(baseAngle) * speed;
            let vy = Math.sin(baseAngle) * speed;
            let dmg = Math.max(12, Math.floor(this.attackPower * 1.0));
            playerProjectiles.push(new PlayerProjectile(startX, startY, vx, vy, dmg, 18, 2, baseAngle));
        } else if (this.swordWaveLevel === 2) {
            let vx = Math.cos(baseAngle) * (speed + 1);
            let vy = Math.sin(baseAngle) * (speed + 1);
            let dmg = Math.max(18, Math.floor(this.attackPower * 1.35));
            playerProjectiles.push(new PlayerProjectile(startX, startY, vx, vy, dmg, 28, 4, baseAngle));
        } else if (this.swordWaveLevel >= 3) {
            const angles = [baseAngle, baseAngle + 0.35, baseAngle - 0.35];
            angles.forEach(ang => {
                let vx = Math.cos(ang) * (speed + 0.5);
                let vy = Math.sin(ang) * (speed + 0.5);
                let dmg = Math.max(15, Math.floor(this.attackPower * 1.15));
                playerProjectiles.push(new PlayerProjectile(startX, startY, vx, vy, dmg, 22, 3, ang));
            });
        }
    }

    superSkill() {
        this.magicCooldown = this.magicCooldownMax;
        playSound('magic');
        triggerScreenShake(8);
        
        // Visual efek ledakan area ungu raksasa
        for(let j=0; j<30; j++) particles.push(new Particle(this.x, this.y, '#9900ff'));
        particles.push(new Shockwave(this.x, this.y)); // Efek shockwave raksasa
        floatingTexts.push(new FloatingText(this.x, this.y - 40, "SHADOW SMASH!", "#9900ff", 24));
        
        // Area serangan (radius 150)
        enemies.forEach(e => {
            const dist = Math.hypot(this.x - e.x, this.y - e.y);
            if (dist < 150) {
                if (e.hasShield) {
                    e.hasShield = false;
                    floatingTexts.push(new FloatingText(e.x, e.y - 25, "SHIELD BROKEN!", "#ff4444", 16));
                }
                if (e.isBoss) {
                    e.takePoiseDamage(50);
                }
                // Damage massiv + knockback massiv
                e.takeDamage(this.attackPower * 4); 
                e.x += (e.x - this.x) * (e.isBoss ? 0.2 : 0.8);
                e.y += (e.y - this.y) * (e.isBoss ? 0.2 : 0.8);
                for(let p=0; p<5; p++) particles.push(new Particle(e.x, e.y, '#ff0000'));
            }
        });
    }

    takeDamage(amount) {
        if (this.invincibleTimer > 0) return; // Kebal selama iframe!
        this.invincibleTimer = 22; // ~0.35 detik jeda aman
        
        let reduced = Math.max(2, amount - this.armor);
        this.hp -= reduced;
        floatingTexts.push(new FloatingText(this.x, this.y - this.height, `-${reduced}`, "#ff3333", 16));
        updateUI();
        if (this.hp <= 0) gameOver();
    }

    gainXp(amount) {
        this.xp += amount;
        floatingTexts.push(new FloatingText(this.x, this.y - 40, `+${amount} XP`, "#00aaff", 12));
        if (this.xp >= this.maxXp) this.levelUp();
        updateUI();
    }

    levelUp() {
        this.level++;
        this.xp -= this.maxXp;
        this.maxXp = Math.floor(this.maxXp * 1.4);
        this.maxHp += 25; this.hp = this.maxHp; // Full heal bonus!
        this.attackPower += 5;
        
        playSound('level');
        levelUpMsg.classList.remove('hidden');
        setTimeout(() => { levelUpMsg.classList.add('hidden'); }, 2000);
        for(let i=0; i<20; i++) particles.push(new Particle(this.x, this.y, '#ffff00'));
    }

    draw(ctx) {
        ctx.save();
        
        // Efek kedip saat kebal (i-frame)
        if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 3) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        }

        ctx.translate(this.x, this.y);
        
        // Membalik gambar kalau jalan ke kiri
        if (this.visualFacing === 'left') ctx.scale(-1, 1);

        // Shadow bawah kaki
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.ellipse(0, this.height/2, this.width/2, 5, 0, 0, Math.PI * 2); ctx.fill();

        // Gambar Animasi Karakter
        const isMoving = keys.up || keys.down || keys.left || keys.right;
        let frameCount = isMoving ? 6 : 4;
        let pY = isMoving ? 0.5 : 0.05; // Baris atas (idle) atau bawah (lari)
        
        // Kalau diem, kunci di frame 0 biar nggak gerak/jitter kek PPT
        const frameIdx = isMoving ? Math.floor(Date.now() / 120) % frameCount : 0;
        
        // Atur lebar crop supaya lebih ketat dan nggak bocor ke frame sebelah
        let pW = isMoving ? 0.125 : 0.1875; // Frame lari = 0.125, Diem = 0.1875
        let pX = isMoving ? 0.25 + frameIdx * 0.125 : 0.25; // Jarak antar frame
        
        let destW = 70 * (pW / 0.1875); // Scale destW secara proporsional supaya TIDAK gepeng/stretch pas lari
        
        let drawn = drawSpriteProportional(ctx, imgPlayer, 
            pX, pY, pW, 0.45, 
            -(destW/2), -45, destW, 70
        );

        if (!drawn) {
            ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("🤺", 0, 0);
        }
        ctx.restore();

        // Gambar Efek Tebasan Pedang (4 Arah)
        if (this.isAttacking) {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            const comboArcBonus = this.comboStep === 3 ? 14 : (this.comboStep === 2 ? 6 : 0);
            const slashRadius = 38 + this.swordRangeLevel * 10 + comboArcBonus;
            const offset = 20 + this.swordRangeLevel * 5;

            // Outer glow tebasan (combo 3 finisher lebih tebal & bercahaya)
            ctx.shadowColor = this.comboStep === 3 ? '#00ffff' : '#38bdf8';
            ctx.shadowBlur = this.comboStep === 3 ? 20 : 12;
            ctx.strokeStyle = this.comboStep === 3 ? '#00ffff' : '#38bdf8';
            ctx.lineWidth = this.comboStep === 3 ? 8 : (this.comboStep === 2 ? 6.5 : 5);
            ctx.beginPath();
            
            if (this.aimDirection === 'right') ctx.arc(offset, 0, slashRadius, -Math.PI/3, Math.PI/3);
            else if (this.aimDirection === 'left') ctx.arc(-offset, 0, slashRadius, Math.PI - Math.PI/3, Math.PI + Math.PI/3);
            else if (this.aimDirection === 'up') ctx.arc(0, -offset, slashRadius, -Math.PI/2 - Math.PI/3, -Math.PI/2 + Math.PI/3);
            else if (this.aimDirection === 'down') ctx.arc(0, offset, slashRadius, Math.PI/2 - Math.PI/3, Math.PI/2 + Math.PI/3);
            ctx.stroke();

            // Inner crisp white core
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            if (this.aimDirection === 'right') ctx.arc(offset, 0, slashRadius, -Math.PI/3.5, Math.PI/3.5);
            else if (this.aimDirection === 'left') ctx.arc(-offset, 0, slashRadius, Math.PI - Math.PI/3.5, Math.PI + Math.PI/3.5);
            else if (this.aimDirection === 'up') ctx.arc(0, -offset, slashRadius, -Math.PI/2 - Math.PI/3.5, -Math.PI/2 + Math.PI/3.5);
            else if (this.aimDirection === 'down') ctx.arc(0, offset, slashRadius, Math.PI/2 - Math.PI/3.5, Math.PI/2 + Math.PI/3.5);
            ctx.stroke();

            ctx.restore();
        }
    }
}

class Decoration {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.scale = 0.8 + Math.random() * 0.4;
    }
    
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Transparan jika pemain / musuh ada di belakang pohon
        if (this.type === 'tree') {
            const chars = [player, ...enemies];
            let behind = chars.some(c => this.y > c.y && (this.y - c.y) < 100 && Math.abs(this.x - c.x) < 60);
            if (behind) ctx.globalAlpha = 0.4;
        }
        
        ctx.scale(this.scale, this.scale);
        
        if (this.type === 'tree') {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 5, 20, 10, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(-6, -40, 12, 45);
            
            ctx.fillStyle = '#1e3814'; ctx.beginPath(); ctx.arc(0, -40, 30, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#2d5a1e'; ctx.beginPath(); ctx.arc(0, -60, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#3a7326'; ctx.beginPath(); ctx.arc(0, -80, 20, 0, Math.PI*2); ctx.fill();
        } else if (this.type === 'rock') {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(0, 3, 15, 8, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#555'; ctx.beginPath(); ctx.ellipse(0, -5, 14, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#777'; ctx.beginPath(); ctx.ellipse(-4, -8, 8, 6, 0, 0, Math.PI*2); ctx.fill();
        } else if (this.type === 'bush') {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(0, 5, 18, 10, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#1b3311'; ctx.beginPath(); ctx.arc(-10, -5, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#1b3311'; ctx.beginPath(); ctx.arc(10, -5, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#264a18'; ctx.beginPath(); ctx.arc(0, -12, 15, 0, Math.PI*2); ctx.fill();
        }
        
        ctx.restore();
    }
}

function initDecorations() {
    decorations = [];
    for(let i=0; i<20; i++) {
        let x, y;
        if (Math.random() < 0.5) { 
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? Math.random() * 150 : canvas.height - Math.random() * 150;
        } else { 
            x = Math.random() < 0.5 ? Math.random() * 150 : canvas.width - Math.random() * 150;
            y = Math.random() * canvas.height;
        }
        decorations.push(new Decoration(x, y, 'tree'));
    }
    for(let i=0; i<15; i++) decorations.push(new Decoration(Math.random() * canvas.width, Math.random() * canvas.height, 'bush'));
    for(let i=0; i<10; i++) decorations.push(new Decoration(Math.random() * canvas.width, Math.random() * canvas.height, 'rock'));
}
